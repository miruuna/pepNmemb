repos:
  # Code formatting
  - repo: https://github.com/psf/black
    rev: 24.2.0
    hooks:
      - id: black
        language_version: python3.9
        args: [--line-length=100]
        
        exclude: tests

  # Import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]
        exclude: tests

  # Linting
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        additional_dependencies: [
          'flake8-bugbear',
          'flake8-docstrings',
        ]
        args: [
          '--max-line-length=100', 
          '--extend-ignore=E203,W503,D200,D104,D100,D401,D400,D206,D202,D103,D205,D210,error'
        ]
        exclude: tests

